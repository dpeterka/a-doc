AWSTemplateFormatVersion: "2010-09-09"
Description: >
  a-doc instance stack: the single always-on EC2 node (SQLite + git want
  one persistent instance — see PLAN.md "Deployment"). No SSH key pair, no
  direct public ingress; a shell is reachable via SSM only. The app itself
  is reached through the public ALB in alb.yaml, which the instance security
  group admits on port 8080 (see network.yaml). Imports its subnet,
  security group, and backup bucket/key from the network and backup stacks
  via Fn::ImportValue rather than manually threaded parameters, so deploy.yml
  only needs to know the two stack names.

Parameters:
  NetworkStackName:
    Type: String
    Default: a-doc-network
    Description: Name of the deployed network stack (for cross-stack imports).
  BackupStackName:
    Type: String
    Default: a-doc-backup
    Description: Name of the deployed backup stack (for cross-stack imports).
  InstanceType:
    Type: String
    Default: t4g.small
    Description: EC2 instance type (arm64 — t4g family per PLAN.md).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >
      Latest Amazon Linux 2023 (standard, not minimal) arm64 AMI, resolved
      via SSM. Standard is required: the minimal AMI does not ship
      amazon-ssm-agent, and this instance is reachable via SSM only.
  DataVolumeSizeGiB:
    Type: Number
    Default: 50
    Description: Size of the encrypted data EBS volume (git data repo + labs.sqlite).

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: a-doc-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: a-doc-backup-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BackupBucketReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${BucketName}"
                    - BucketName:
                        Fn::ImportValue: !Sub "${BackupStackName}-BucketName"
                  - !Sub
                    - "arn:aws:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${BackupStackName}-BucketName"
              - Sid: BackupKeyUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource:
                  Fn::ImportValue: !Sub "${BackupStackName}-KmsKeyArn"
        - PolicyName: a-doc-bootstrap-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # UserData/install.sh read these once-created SecureString
              # parameters at boot: /a-doc/github-deploy-token,
              # /a-doc/rclone-conf, /a-doc/anthropic-api-key,
              # /a-doc/openai-api-key, /a-doc/featherless-api-key. See
              # README.md "One-time SSM parameters" for the exact
              # `aws ssm put-parameter` commands used to create them. Web
              # login credentials are managed separately via `adoc user
              # add` (SSM Session Manager shell), not an SSM parameter.
              - Sid: SsmParameterRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/a-doc/*"
              # These parameters are SecureString encrypted with the
              # account's AWS-managed default key (alias/aws/ssm) — we never
              # passed --key-id when creating them, so no custom KMS key
              # policy is needed. If a customer-managed key were used
              # instead, that key's own key policy would additionally need
              # to grant kms:Decrypt to this role (the aws/ssm default key's
              # policy already allows account principals with IAM
              # permission to use it, which this statement grants).
              - Sid: SsmDefaultKmsDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
              # install.sh resolves the backup bucket name once per run via
              # this account/region-wide (non resource-scopable) action
              # rather than requiring the bucket name to be threaded through
              # as a CFN parameter; see README.md "Deploy runbook".
              - Sid: BackupBucketExportLookup
                Effect: Allow
                Action:
                  - cloudformation:ListExports
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub "${NetworkStackName}-SubnetId"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-SecurityGroupId"
      # No KeyName — no SSH keys (CLAUDE.md "Infrastructure": SSM-only shell access).
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref DataVolumeSizeGiB
            Encrypted: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # a-doc instance bootstrap entrypoint. Kept deliberately minimal —
          # deploy/install.sh (fetched below, from the app repo itself) owns
          # all real provisioning logic and is safe to re-run; see
          # README.md "Deploy runbook" for the full picture and the
          # one-time SSM parameters this depends on.
          set -euo pipefail
          exec > >(tee -a /var/log/a-doc-userdata.log) 2>&1
          echo "=== a-doc UserData run at $(date -u --iso-8601=seconds) ==="

          # --- Resolve region via IMDSv2 (every aws cli call below needs it) ---
          IMDS_TOKEN="$(curl -fsS -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")"
          export AWS_DEFAULT_REGION="$(curl -fsS \
            -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/placement/region)"

          # --- Ensure git + the AWS CLI are present before we can fetch
          # anything from SSM or clone the app repo ---
          command -v git &>/dev/null || dnf install -y git
          if ! command -v aws &>/dev/null; then
            dnf install -y unzip
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" \
              -o /tmp/awscliv2.zip
            unzip -q -o /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install
            rm -rf /tmp/awscliv2.zip /tmp/aws
          fi

          # --- Format (first boot only) and mount the data EBS volume ---
          if ! blkid /dev/xvdb &>/dev/null; then
            mkfs -t ext4 /dev/xvdb
          fi
          mkdir -p /data
          grep -q '^/dev/xvdb ' /etc/fstab || \
            echo '/dev/xvdb /data ext4 defaults,nofail 0 2' >> /etc/fstab
          mountpoint -q /data || mount /data

          # --- Clone (or update) the application repo using a scoped,
          # read-only GitHub deploy token (this repo is private) ---
          GITHUB_TOKEN="$(aws ssm get-parameter --name /a-doc/github-deploy-token \
            --with-decryption --query Parameter.Value --output text)"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/dpeterka/a-doc.git"
          if [ -d /opt/a-doc/.git ]; then
            git -C /opt/a-doc remote set-url origin "$REPO_URL"
            git -C /opt/a-doc fetch origin main
            git -C /opt/a-doc checkout main
            git -C /opt/a-doc reset --hard origin/main
          else
            git clone --branch main "$REPO_URL" /opt/a-doc
          fi

          # --- Hand off: all further provisioning logic lives in install.sh ---
          bash /opt/a-doc/deploy/install.sh
      Tags:
        - Key: Name
          Value: a-doc-instance

Outputs:
  InstanceId:
    Value: !Ref Instance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
