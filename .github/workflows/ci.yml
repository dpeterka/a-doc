name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test (with coverage gate)
        run: uv run pytest

      # A release branch must carry the version bump it names. v0.20.0 was
      # tagged and deployed from a branch whose `chore(release)` commit was
      # never made, so the tag said 0.20.0 while the package said 0.19.0.
      # Checked on the PR because deploy fires on the push to `main` — before
      # the tag exists, so a tag-time check would only report a mislabelled
      # release after it had already shipped.
      - name: Release version matches the branch
        if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
        run: uv run python scripts/check_release_version.py --branch "${{ github.head_ref }}"

  backmerge-drift:
    # A release merged to main must be merged back to develop. Missed three
    # times here, and each time the symptom arrived a release late: the next
    # version bump found no string to replace and produced an empty pull
    # request. This names it immediately instead.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare main and develop versions
        run: |
          git fetch origin develop:refs/remotes/origin/develop
          main_v=$(git show origin/main:pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          dev_v=$(git show origin/develop:pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          python scripts/check_release_version.py --backmerge "$main_v" "$dev_v"
