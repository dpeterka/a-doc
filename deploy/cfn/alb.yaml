AWSTemplateFormatVersion: "2010-09-09"
Description: >
  a-doc ALB stack: public-facing Application Load Balancer, ACM certificate,
  and the Route53 alias record for the patient-facing domain. This is the
  public entry point that replaced Tailscale (explicit user decision) — the
  app itself is still not directly reachable from the internet (see
  deploy/cfn/ecs.yaml's ServiceSecurityGroup, which only admits the ALB's
  security group on port 8080). Authentication is an in-app
  username/password gate with in-app rate limiting (src/adoc/web); this
  stack adds no WAF and no additional network-level auth by design.

  The target group is TargetType "ip" (Fargate/awsvpc, registered/
  deregistered dynamically by the ECS service in deploy/cfn/ecs.yaml) —
  there is no static Targets list and no InstanceStackName import any more
  (see ADR 0006: EC2+install.sh -> ECS Fargate + EFS).

Parameters:
  NetworkStackName:
    Type: String
    Default: a-doc-network
    Description: Name of the deployed network stack (for cross-stack imports).
  DomainName:
    Type: String
    Default: adoc.petabloc.io
    Description: Public DNS name patients use to reach the app.
  HostedZoneId:
    Type: String
    Default: Z009458513KFY2WNUS7C0
    Description: Route53 hosted zone id for petabloc.io.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: a-doc-cert

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # No explicit Name: named ELB resources cannot be replaced in place
      # (the new resource collides with the old one's name). Identity comes
      # from stack outputs/exports, not the physical name.
      Type: application
      Scheme: internet-facing
      Subnets:
        - Fn::ImportValue: !Sub "${NetworkStackName}-SubnetId"
        - Fn::ImportValue: !Sub "${NetworkStackName}-Subnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSecurityGroupId"
      Tags:
        - Key: Name
          Value: a-doc-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Port: 8080
      Protocol: HTTP
      # Fargate awsvpc tasks are registered/deregistered by the ECS service
      # itself (deploy/cfn/ecs.yaml's WebService), not declared statically
      # here - no Targets property, no InstanceStackName import.
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: a-doc-tg

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-AlbDnsName"
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupArn"
  Url:
    Value: !Sub "https://${DomainName}/"
