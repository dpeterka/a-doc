name: deploy

# Builds the application image, pushes it to ECR, and deploys the
# CloudFormation stacks in order: ci -> network -> backup -> alb -> ecs.
# (See ADR 0006: EC2+install.sh -> ECS Fargate + EFS - this replaced the
# old network -> backup -> instance -> alb order, which no longer has an
# instance stack in it at all.)
#
# NOTE — bootstrap chicken-and-egg: `deploy/cfn/ci.yaml` creates the OIDC
# IAM role that *this workflow* assumes below. That means ci.yaml itself
# cannot be deployed by this workflow the first time — it must be deployed
# once, manually, from a local admin session (see README.md "Deploy
# overview"). After that one-time bootstrap, its `DeployRoleArn` output is
# copied into the `AWS_DEPLOY_ROLE_ARN` repository variable and this
# workflow can deploy everything else (including future updates to
# ci.yaml, at which point it is self-hosting).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: "536726971394"
  ECR_REPOSITORY: a-doc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD~1 must exist for the sidecar change check below. The
          # default shallow clone has no parent, so `git diff HEAD~1 HEAD`
          # errored, the error went to /dev/null, and the check fell
          # through to "changed" on EVERY deploy — rebuilding the sidecar
          # every time and defeating its own purpose.
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Change sets are reviewed via PR before merge (see CLAUDE.md
      # "Infrastructure"); `aws cloudformation deploy` below applies the
      # already-reviewed template directly. To inspect a change set instead
      # of applying it, add `--no-execute-changeset` to any of the deploy
      # commands below and review it before a follow-up execute.

      # Self-hosting: apply ci.yaml first so deploy-role policy changes and
      # the ECR repository itself exist before anything that needs to push
      # to it or assume the widened permissions.
      - name: Deploy ci stack (deploy role + ECR repository)
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-ci \
            --template-file deploy/cfn/ci.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the application image
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_URI:${{ github.sha }}" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      # Built only when its inputs change. The sidecar is ~630MB and pins a
      # LIRICAL version that moves a few times a year, so rebuilding it on
      # every application deploy would add minutes to each one for nothing.
      - name: Check whether the LIRICAL sidecar changed
        id: lirical_changed
        run: |
          # Report WHY, rather than silently defaulting to a rebuild: the
          # previous version sent the error to /dev/null, so a shallow clone
          # looked identical to a real change.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "no parent commit available — assuming the sidecar changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD~1 HEAD -- deploy/lirical/; then
            echo "deploy/lirical/ unchanged — reusing the sidecar image in ECR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy/lirical/ changed — rebuilding the sidecar"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the LIRICAL sidecar image
        if: steps.lirical_changed.outputs.changed == 'true'
        # NEVER blocks the application deploy. This build downloads LIRICAL's
        # data from external hosts at image-build time, so it fails for
        # reasons that have nothing to do with this repository — and it did:
        # a transient download failure during the v0.25.2 deploy skipped
        # "Deploy ECS stack" entirely, so an application fix did not ship
        # because an OPTIONAL sidecar could not be rebuilt.
        #
        # The sidecar is supplementary by design: a review completes with
        # `LiricalComparison(ran=False)` when it is unavailable. "Resolve the
        # LIRICAL sidecar image" below falls back to whatever :latest is
        # already in ECR, so a failed rebuild costs a stale sidecar, never a
        # blocked release.
        continue-on-error: true
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/a-doc-lirical
        run: |
          # The image runs its own smoke test at build time (a fixed synthetic
          # phenotype must still rank Loeys-Dietz/Marfan at the top), so a
          # LIRICAL release that breaks the data assumptions fails HERE rather
          # than in a deep review.
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_URI:${{ github.sha }}" \
            -t "$IMAGE_URI:latest" \
            deploy/lirical/
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-network \
            --template-file deploy/cfn/network.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy backup stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-backup \
            --template-file deploy/cfn/backup.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      # No InstanceStackName any more - the target group is TargetType "ip",
      # registered/deregistered by the ECS service in the ecs stack below.
      - name: Deploy ALB stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-alb \
            --template-file deploy/cfn/alb.yaml \
            --parameter-overrides \
              NetworkStackName=a-doc-network \
              DomainName=adoc.petabloc.io \
              HostedZoneId=Z009458513KFY2WNUS7C0 \
            --no-fail-on-empty-changeset

      # Must come after network/backup/alb: ecs.yaml imports their exports
      # (VPC/subnets/SGs, backup bucket+key, the ALB target group).
      # Resolved from ECR rather than assumed: the sidecar image is built only
      # when deploy/lirical/ changes, so a stack deployed before that first
      # build has no `latest` tag to point at. An empty value leaves the
      # sidecar task definition out of the stack entirely (its Condition),
      # which is the correct state until the image exists.
      - name: Resolve the LIRICAL sidecar image
        run: |
          URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/a-doc-lirical"
          if aws ecr describe-images \
               --repository-name a-doc-lirical \
               --image-ids imageTag=latest >/dev/null 2>&1; then
            echo "LIRICAL_IMAGE_URI=$URI:latest" >> "$GITHUB_ENV"
          else
            echo "LIRICAL_IMAGE_URI=" >> "$GITHUB_ENV"
            echo "no a-doc-lirical:latest in ECR yet - sidecar task definition skipped"
          fi

      - name: Deploy ECS stack
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-ecs \
            --template-file deploy/cfn/ecs.yaml \
            --parameter-overrides \
              NetworkStackName=a-doc-network \
              BackupStackName=a-doc-backup \
              AlbStackName=a-doc-alb \
              ImageUri="$IMAGE_URI" \
              LiricalImageUri="$LIRICAL_IMAGE_URI" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
