AWSTemplateFormatVersion: "2010-09-09"
Description: >
  a-doc CI stack: an OIDC identity provider trust for GitHub Actions, a
  deploy role it can assume (scoped to this repo's main branch), and the
  ECR repository the deploy workflow builds/pushes the application image
  into (see PLAN.md "Deployment" and ADR 0006: EC2+install.sh -> ECS
  Fargate + EFS).

  Bootstrap note (chicken-and-egg): this stack creates the very role that
  .github/workflows/deploy.yml assumes to deploy CloudFormation stacks —
  including, potentially, updates to this stack itself. That means the
  *first* deployment of ci.yaml cannot be done by the GitHub Actions
  workflow it enables; it must be applied once, manually, from a local
  admin AWS session (e.g. `aws cloudformation deploy --template-file
  deploy/cfn/ci.yaml ...`). After that one-time bootstrap, this stack's
  `DeployRoleArn` output is copied into the `AWS_DEPLOY_ROLE_ARN` GitHub
  repository variable, and all subsequent deploys (including future changes
  to ci.yaml itself) go through CI like every other stack.

Parameters:
  GitHubOrg:
    Type: String
    Default: dpeterka
  GitHubOrgId:
    Type: Number
    Default: 754814
    Description: >
      Immutable GitHub account ID for GitHubOrg. GitHub's OIDC tokens embed
      immutable IDs in the sub claim (repo:owner@ID/repo@ID:ref:...), so the
      trust condition must include them; pinning IDs also defends against
      owner/repo rename-and-recreate attacks. (`gh api users/<org> --jq .id`)
  RepoName:
    Type: String
    Default: a-doc
  RepoId:
    Type: Number
    Default: 1343763065
    Description: >
      Immutable GitHub repository ID for RepoName.
      (`gh api repos/<org>/<repo> --jq .id`)
  OidcProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of an existing token.actions.githubusercontent.com OIDC provider
      in this account, if one was already created (an AWS account may only
      have one). Leave blank to have this stack create it.

Conditions:
  CreateOidcProvider: !Equals [!Ref OidcProviderArn, ""]

Resources:
  # ECR repository for the a-doc application image (deploy.yml builds and
  # pushes here, tagged with the git sha + latest; deploy/cfn/ecs.yaml's
  # ImageUri parameter references an image in this repo). See ADR 0006.
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: a-doc
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # CloudFormation/IAM can fetch the provider's thumbprint automatically
      # for this well-known GitHub endpoint; ThumbprintList is included
      # explicitly for older account behavior that still requires it.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: a-doc-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${RepoName}@${RepoId}:ref:refs/heads/main"
      Policies:
        - PolicyName: a-doc-deploy-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # TODO: scope down — CloudFormation/EC2 actions are broad
              # because Phase 0 doesn't yet know the full set of resource
              # types future stacks will need. Tighten once instance/backup
              # stacks stabilize.
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/a-doc-*/*"
              # Widened from role/a-doc-instance-role (the sole EC2 role) to
              # role/a-doc-* so the deploy role can also pass the ECS task
              # execution/task roles and the EventBridge Scheduler role that
              # ecs.yaml creates (a-doc-task-execution-role, a-doc-task-role,
              # a-doc-events-role) — see ADR 0006.
              - Sid: PassAppRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/a-doc-*"
              - Sid: Ec2Broad
                Effect: Allow
                Action:
                  - ec2:*
                Resource: "*"
              - Sid: IamRoleManagement
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/a-doc-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/a-doc-*"
              # instance.yaml resolves its AMI via an SSM parameter type
              # (AWS::SSM::Parameter::Value<...>); CloudFormation resolves it
              # with the *calling* principal's permissions, so the deploy role
              # needs read access to the public AMI parameters.
              - Sid: SsmPublicAmiParameters
                Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - "arn:aws:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*"
              - Sid: BackupBucketBroad
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - "arn:aws:s3:::a-doc-*"
                  - "arn:aws:s3:::a-doc-*/*"
              - Sid: KmsBroad
                Effect: Allow
                Action:
                  - kms:*
                Resource: "*"
                # TODO: scope to the specific backup KMS key ARN once it is
                # stable across redeploys (it is currently re-creatable by
                # backup.yaml, which would otherwise require updating this
                # policy on every key rotation/stack recreation).
              # deploy/cfn/alb.yaml: ALB, listeners, and target group.
              - Sid: ElasticLoadBalancingBroad
                Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: "*"
                # TODO: scope down to a-doc-alb/a-doc-tg once ELBv2's
                # resource-level permission model (which mixes ARNs that
                # don't exist until create-time) is worth the added
                # complexity here.
              # deploy/cfn/alb.yaml: the ACM certificate for adoc.petabloc.io
              # (DNS-validated; ACM has no resource-level permissions for
              # RequestCertificate, so this is account-wide by necessity).
              - Sid: AcmCertificateManagement
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: "*"
              # deploy/cfn/alb.yaml: the DNS validation record ACM needs and
              # the patient-facing alias record, both in the petabloc.io
              # hosted zone only.
              - Sid: Route53RecordManagement
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource: "arn:aws:route53:::hostedzone/Z009458513KFY2WNUS7C0"
              - Sid: Route53ReadAndChangeStatus
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "arn:aws:route53:::hostedzone/Z009458513KFY2WNUS7C0"
              - Sid: Route53GetChange
                Effect: Allow
                Action:
                  - route53:GetChange
                Resource: "arn:aws:route53:::change/*"
              # deploy.yml's docker-build-and-push job authenticates to ECR
              # with `aws ecr get-login-password`, which calls this
              # account-wide (non resource-scopable) action.
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              # Push/pull + lifecycle-policy management, scoped to the one
              # a-doc ECR repository this stack creates above.
              - Sid: EcrRepositoryPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:TagResource
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:SetRepositoryPolicy
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/a-doc"
              # deploy/cfn/ecs.yaml: cluster, service, task definitions,
              # scheduled-task RunTask wiring.
              - Sid: EcsDeployBroad
                Effect: Allow
                Action:
                  - ecs:*
                Resource: "*"
                # TODO: scope down to a-doc-* clusters/services/task-def
                # families once ECS's resource-level permission model
                # (task definition ARNs are versioned and don't exist
                # until register-time) is worth the added complexity here.
              # deploy/cfn/ecs.yaml: the EFS filesystem, mount targets, and
              # access point backing the ECS tasks' /data mount.
              - Sid: EfsBroad
                Effect: Allow
                Action:
                  - elasticfilesystem:*
                Resource: "*"
                # TODO: scope to the specific a-doc EFS filesystem/access-
                # point ARNs once they are stable across redeploys.
              # deploy/cfn/ecs.yaml: EventBridge rules + targets for the
              # scheduled ingest/review/backup ECS tasks.
              - Sid: EventsSchedulingBroad
                Effect: Allow
                Action:
                  - events:*
                Resource: "*"
                # TODO: scope to the specific a-doc-* rule ARNs once
                # ecs.yaml's scheduled-task rules stabilize.
              # CloudWatch Logs for the a-doc application/task log group
              # (deploy/cfn/ecs.yaml's LogGroup) — scoped to /a-doc/* rather
              # than account-wide.
              - Sid: AppLogGroups
                Effect: Allow
                Action:
                  - logs:*
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/a-doc/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/a-doc/*:*"

Outputs:
  DeployRoleArn:
    Description: >
      Copy this value into the AWS_DEPLOY_ROLE_ARN GitHub repository
      variable after the first (manual) deploy of this stack.
    Value: !GetAtt DeployRole.Arn
  EcrRepositoryUri:
    Description: Push/pull URI for the a-doc application image.
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}"
