name: eval

# Monthly self-evaluation run against synthetic fixtures only — no PHI in
# CI (see CLAUDE.md rule 1). All three suites run fully offline:
# `extraction` replays tests/fixtures/extractions/*.json through the real,
# deterministic ingest.reconcile (no model call); `redteam` and
# `hallucination` (PLAN.md Phase 2's acceptance gate: planted-fact/
# fabricated-citation containment, entailment-verifier precision/recall,
# abstention rate) each drive a scripted FAKE LlmClient built inside the
# suite itself (no real provider, no network). `--out tmp` means this
# never touches ADOC_DATA_DIR or a data repo either.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run eval suites (extraction + redteam + hallucination, offline)
        run: uv run adoc eval --suite redteam --suite extraction --suite hallucination --out tmp

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: tmp/
