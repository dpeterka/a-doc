# Role -> model bindings (see PLAN.md "Model strategy & self-evaluation").
#
# Every role is loaded by `adoc.config.load_model_bindings()` as a *list* of
# bindings, even when only one model fills the role — this keeps the loader's
# return type uniform (`dict[str, list[ModelBinding]]`) regardless of whether
# a role is single-bound (most roles) or multi-bound (blind_panel). Changing
# a binding requires an `adoc eval` comparison report and a PR (see CLAUDE.md
# rule 4) — never hardcode model ids in code.

roles:
  primary_reasoner:
    provider: anthropic
    model: claude-opus-5
    params:
      effort: high

  challenger:
    provider: openai
    model: gpt-5.2
    params:
      effort: high

  # Entailment Verifier (PLAN.md Phase 2, "Grounding & anti-hallucination
  # hardening"): judges whether a claim's cited source text actually
  # supports the claim. Bound to a THIRD family, distinct from both
  # `primary_reasoner` (Anthropic) and `challenger` (OpenAI) - the whole
  # point (mirrors ADR 0005's Challenger cross-family rule) is that the
  # verifier must not share the Ledger-Maintainer's blind spots. Featherless
  # is already paid flat-rate for the blind panel, so this adds no
  # incremental per-token cost.
  entailment_verifier:
    # DeepSeek V3, not R1. Judging "does this row say what this claim says"
    # is a short factual comparison, not a reasoning problem, and a live
    # comparison over the 20 labelled pairs in tests/fixtures/entailment/
    # showed R1 was both slower AND less accurate: R1 78s / 17-of-20, V3
    # 20s / 19-of-20, gpt-5.2 10s / 19-of-20. R1 also skewed toward
    # not_entailed (10 vs 8), which is the over-flagging that cost a real
    # diagnostic turn.
    #
    # V3 over gpt-5.2 despite gpt being marginally faster: V3 keeps this a
    # THIRD model family, distinct from the Ledger-Maintainer (Anthropic)
    # and the Challenger (OpenAI). ADR 0005's point is independent blind
    # spots; putting the challenger and the verifier on one family would
    # let a shared blind spot pass both. 10s of difference inside a
    # multi-minute turn does not buy back that independence.
    provider: featherless
    model: deepseek-ai/DeepSeek-V3-0324
    params: {}

  blind_panel:
    - provider: anthropic
      model: claude-opus-5
      params:
        effort: high
    - provider: openai
      model: gpt-5.2
      params:
        effort: high
    - provider: featherless
      model: deepseek-ai/DeepSeek-R1-0528
      params: {}

  extractor_pass_a:
    provider: anthropic
    model: claude-sonnet-5
    params: {}

  extractor_pass_b:
    provider: openai
    model: gpt-5.2
    params: {}

  classifier:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    params: {}

  # Test-Chooser (PLAN.md "Session loops (c)"): rewrites case/questions-open.md
  # from the post-challenge ledger. Bound to the primary reasoner's model since
  # it needs the same case-level judgment as the Ledger-Maintainer/Composer.
  test_chooser:
    provider: anthropic
    model: claude-opus-5
    params:
      effort: high

  # Conversational onboarding (docs/adr/0011): probes vagueness, establishes
  # timing, classifies doctor-diagnosed vs. patient-assumption attribution,
  # and cross-references already-ingested documents — needs the same
  # case-level judgment as the primary reasoner, so it is bound to the same
  # model. A NEW role (not a change to an existing binding); see CLAUDE.md
  # rule 4 if this is ever rebound independently of `primary_reasoner`.
  intake_agent:
    provider: anthropic
    model: claude-opus-5
    params:
      effort: high

  # TEST HARNESS ONLY (`scripts/intake-replay --persona`). Role-plays the
  # patient so a full initial visit can be replayed without a human typing
  # for an hour. NOT part of any DAG, never reached from the app — nothing
  # patient-facing depends on it, so rebinding it needs no eval report.
  #
  # A fixed script of patient answers cannot test a conversational agent:
  # the intake agent rewords its questions and invents new ones (it started
  # asking for a preferred name), and a canned answer list silently drifts
  # one question behind, so the transcript stops being a test of anything.
  # The simulator answers whatever was actually asked.
  #
  # Deliberately NOT the primary reasoner: the simulator should be a
  # different mind from the agent under test, and a cheap one, since it
  # speaks once per turn.
  patient_simulator:
    provider: anthropic
    model: claude-sonnet-5
    params: {}
