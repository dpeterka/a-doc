name: deploy

# Builds the application image, pushes it to ECR, and deploys the
# CloudFormation stacks in order: ci -> network -> backup -> alb -> ecs.
# (See ADR 0006: EC2+install.sh -> ECS Fargate + EFS - this replaced the
# old network -> backup -> instance -> alb order, which no longer has an
# instance stack in it at all.)
#
# NOTE — bootstrap chicken-and-egg: `deploy/cfn/ci.yaml` creates the OIDC
# IAM role that *this workflow* assumes below. That means ci.yaml itself
# cannot be deployed by this workflow the first time — it must be deployed
# once, manually, from a local admin session (see README.md "Deploy
# overview"). After that one-time bootstrap, its `DeployRoleArn` output is
# copied into the `AWS_DEPLOY_ROLE_ARN` repository variable and this
# workflow can deploy everything else (including future updates to
# ci.yaml, at which point it is self-hosting).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: "536726971394"
  ECR_REPOSITORY: a-doc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Change sets are reviewed via PR before merge (see CLAUDE.md
      # "Infrastructure"); `aws cloudformation deploy` below applies the
      # already-reviewed template directly. To inspect a change set instead
      # of applying it, add `--no-execute-changeset` to any of the deploy
      # commands below and review it before a follow-up execute.

      # Self-hosting: apply ci.yaml first so deploy-role policy changes and
      # the ECR repository itself exist before anything that needs to push
      # to it or assume the widened permissions.
      - name: Deploy ci stack (deploy role + ECR repository)
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-ci \
            --template-file deploy/cfn/ci.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the application image
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_URI:${{ github.sha }}" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-network \
            --template-file deploy/cfn/network.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy backup stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-backup \
            --template-file deploy/cfn/backup.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      # No InstanceStackName any more - the target group is TargetType "ip",
      # registered/deregistered by the ECS service in the ecs stack below.
      - name: Deploy ALB stack
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-alb \
            --template-file deploy/cfn/alb.yaml \
            --parameter-overrides \
              NetworkStackName=a-doc-network \
              DomainName=adoc.petabloc.io \
              HostedZoneId=Z009458513KFY2WNUS7C0 \
            --no-fail-on-empty-changeset

      # Must come after network/backup/alb: ecs.yaml imports their exports
      # (VPC/subnets/SGs, backup bucket+key, the ALB target group).
      - name: Deploy ECS stack
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws cloudformation deploy \
            --stack-name a-doc-ecs \
            --template-file deploy/cfn/ecs.yaml \
            --parameter-overrides \
              NetworkStackName=a-doc-network \
              BackupStackName=a-doc-backup \
              AlbStackName=a-doc-alb \
              ImageUri="$IMAGE_URI" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
